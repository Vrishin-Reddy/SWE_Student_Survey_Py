<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Survey Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 2rem;
            padding-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .checkbox-group {
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Student Survey</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/survey/">Submit Survey</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/surveys/">View Surveys</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Student Survey Form</h2>
        <div class="alert alert-success" id="successMessage" style="display: none;">
            Survey submitted successfully!
        </div>
        <div class="alert alert-danger" id="errorMessage" style="display: none;">
            Error submitting survey. Please check your input and try again.
        </div>
        <form id="surveyForm">
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="firstName">First Name:</label>
                        <input type="text" class="form-control" id="firstName" name="first_name" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="lastName">Last Name:</label>
                        <input type="text" class="form-control" id="lastName" name="last_name" required>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="streetAddress">Street Address:</label>
                <input type="text" class="form-control" id="streetAddress" name="street_address" required>
            </div>

            <div class="row">
                <div class="col-md-4">
                    <div class="form-group">
                        <label for="city">City:</label>
                        <input type="text" class="form-control" id="city" name="city" required>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label for="state">State:</label>
                        <input type="text" class="form-control" id="state" name="state" required>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label for="zipCode">ZIP Code:</label>
                        <input type="text" class="form-control" id="zipCode" name="zip_code" required>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="telephone">Telephone Number:</label>
                        <input type="tel" class="form-control" id="telephone" name="telephone" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                </div>
            </div>

            <div class="form-group mt-4">
                <label>What did you like most about the university?</label>
                <div class="checkbox-group">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="likedStudents" name="liked_students">
                        <label class="form-check-label" for="likedStudents">Students</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="likedLocation" name="liked_location">
                        <label class="form-check-label" for="likedLocation">Location</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="likedCampus" name="liked_campus">
                        <label class="form-check-label" for="likedCampus">Campus</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="likedAtmosphere" name="liked_atmosphere">
                        <label class="form-check-label" for="likedAtmosphere">Atmosphere</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="likedDormRooms" name="liked_dorm_rooms">
                        <label class="form-check-label" for="likedDormRooms">Dorm Rooms</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="likedSports" name="liked_sports">
                        <label class="form-check-label" for="likedSports">Sports</label>
                    </div>
                </div>
            </div>

            <div class="form-group mt-4">
                <label>How did you become interested in the university?</label>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="interest_source" id="interestFriends" value="friends" required>
                    <label class="form-check-label" for="interestFriends">Friends</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="interest_source" id="interestTelevision" value="television">
                    <label class="form-check-label" for="interestTelevision">Television</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="interest_source" id="interestInternet" value="internet">
                    <label class="form-check-label" for="interestInternet">Internet</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="interest_source" id="interestOther" value="other">
                    <label class="form-check-label" for="interestOther">Other</label>
                </div>
            </div>

            <div class="form-group mt-4">
                <label for="recommendationLikelihood">How likely are you to recommend this university to other prospective students? (1-10)</label>
                <input type="range" class="form-range" min="1" max="10" id="recommendationLikelihood" name="recommendation_likelihood" value="5">
                <div class="d-flex justify-content-between">
                    <span>1</span>
                    <span>2</span>
                    <span>3</span>
                    <span>4</span>
                    <span>5</span>
                    <span>6</span>
                    <span>7</span>
                    <span>8</span>
                    <span>9</span>
                    <span>10</span>
                </div>
            </div>

            <div class="form-group mt-3">
                <label for="comments">Additional Comments:</label>
                <textarea class="form-control" id="comments" name="comments" rows="5"></textarea>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Submit Survey</button>
                <button type="reset" class="btn btn-secondary">Reset Form</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('surveyForm');
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Gather form data
                const formData = new FormData(form);
                const surveyData = {
                    first_name: formData.get('first_name'),
                    last_name: formData.get('last_name'),
                    street_address: formData.get('street_address'),
                    city: formData.get('city'),
                    state: formData.get('state'),
                    zip_code: formData.get('zip_code'),
                    telephone: formData.get('telephone'),
                    email: formData.get('email'),
                    liked_students: formData.has('liked_students'),
                    liked_location: formData.has('liked_location'),
                    liked_campus: formData.has('liked_campus'),
                    liked_atmosphere: formData.has('liked_atmosphere'),
                    liked_dorm_rooms: formData.has('liked_dorm_rooms'),
                    liked_sports: formData.has('liked_sports'),
                    interest_source: formData.get('interest_source'),
                    recommendation_likelihood: parseInt(formData.get('recommendation_likelihood')),
                    comments: formData.get('comments')
                };

                // Submit data via API
                fetch('/api/surveys/submit/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(surveyData),
                })
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    }
                    throw new Error('Network response was not ok');
                })
                .then(data => {
                    // Show success message
                    successMessage.style.display = 'block';
                    errorMessage.style.display = 'none';
                    form.reset();
                    
                    // Scroll to top to see success message
                    window.scrollTo(0, 0);
                    
                    // Automatically redirect to survey list after 3 seconds
                    setTimeout(() => {
                        window.location.href = '/surveys/';
                    }, 3000);
                })
                .catch(error => {
                    console.error('Error:', error);
                    // Show error message
                    errorMessage.style.display = 'block';
                    successMessage.style.display = 'none';
                    window.scrollTo(0, 0);
                });
            });
        });
